name: Deploy Production

on:
  workflow_run:
    workflows: ["Build and Push to GHCR"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: 10xcoder-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      # ----------------------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # Create ENV file
      # ----------------------------------------------------------------------
      - name: Create production env file
        run: |
          echo "${{ secrets.ENV_FILE_PROD }}" > .env

      # ----------------------------------------------------------------------
      # Copy config files to EC2
      # ----------------------------------------------------------------------
      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          source: >
            docker-compose.yml,
            nginx,
            .env,
            scripts,
            apps/api/migration.Dockerfile,
            apps/api/drizzle
          target: /home/${{ secrets.USERNAME }}/10xcoder-prod

      # ----------------------------------------------------------------------
      # Deploy on EC2 (pull and restart)
      # ----------------------------------------------------------------------
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          command_timeout: 5m
          script: |
            set -e

            cd /home/${{ secrets.USERNAME }}/10xcoder-prod

            echo "🔐 Loading environment"
            set -a
            source .env
            set +a

            export COMPOSE_PROJECT_NAME=10xcoder-prod

            echo "🔑 Login to GHCR"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

            echo "📥 Pulling latest images"
            docker compose pull

            echo "🚀 Starting containers"
            docker compose up -d

            echo "⏳ Waiting for DB to be ready"
            for i in {1..30}; do
              if docker compose exec -T db pg_isready -U "$POSTGRES_USER" >/dev/null 2>&1; then
                echo "✅ DB ready"
                break
              fi
              sleep 2
            done

            echo "🧪 Running migrations"
            docker compose --profile migrate run --rm migrate

            echo "🔍 Verifying required migrations in DB"
            set +e
            PSQL_OUTPUT=$(docker compose exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT string_agg(check_name, ',') FROM (SELECT 'resource_type_id_uuidv7_default' AS check_name WHERE NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'resource_type' AND column_name = 'id' AND data_type = 'uuid' AND column_default ILIKE '%uuidv7%') UNION ALL SELECT 'resource_description_max_5000_chk' AS check_name WHERE NOT EXISTS (SELECT 1 FROM pg_constraint c JOIN pg_class t ON t.oid = c.conrelid JOIN pg_namespace n ON n.oid = t.relnamespace WHERE n.nspname = 'public' AND t.relname = 'resource' AND c.conname = 'resource_description_max_5000_chk')) checks;")
            PSQL_STATUS=$?
            set -e
            if [ "$PSQL_STATUS" -ne 0 ]; then
              echo "❌ Failed to query migrations via docker compose exec -T db psql (exit code: $PSQL_STATUS)"
              exit "$PSQL_STATUS"
            fi
            MISSING_TAGS="$PSQL_OUTPUT"
            if [ -n "$MISSING_TAGS" ]; then
              echo "❌ Missing required migration effects: $MISSING_TAGS"
              exit 1
            fi
            echo "✅ Required migration effects are present"

            echo "🗑️ Cleaning old images"
            docker image prune -f || true

            echo "📊 Final container status"
            docker compose ps

            echo "🎉 Deployment completed successfully"
