name: Deploy Production

on:
  workflow_run:
    workflows: ["Build and Push to GHCR"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Server image tag to deploy (defaults to latest)"
        required: false
        default: "latest"

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: 10xcoder-prod
  DEPLOY_IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event.inputs.image_tag || 'latest' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      # ----------------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # Create ENV file
      # ----------------------------------------------------------------
      - name: Create production env file
        run: |
          echo "${{ secrets.ENV_FILE_PROD }}" > .env

      - name: Create Traefik auth file
        run: |
          printf '%s\n' '${{ secrets.TRAEFIK_USERS_HTPASSWD }}' > traefik/users.htpasswd

      # ----------------------------------------------------------------
      # Copy config files to server
      # ----------------------------------------------------------------
      - name: Copy files to production server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          source: >
            docker-compose.yml,
            docker-compose.infra.yml,
            traefik,
            scripts,
            apps/server/migration.Dockerfile,
            apps/server/drizzle,
            .env
          target: /home/${{ secrets.USERNAME }}/10xcoder-prod

      # ----------------------------------------------------------------
      # Deploy on server
      # ----------------------------------------------------------------
      - name: Deploy on production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -e

            cd /home/${{ secrets.USERNAME }}/10xcoder-prod

            export COMPOSE_PROJECT_NAME=10xcoder-prod
            export IMAGE_TAG=${{ env.DEPLOY_IMAGE_TAG }}
            echo "🏷️ Deploying server image tag: ${IMAGE_TAG}"

            echo "🔑 Login to GHCR"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

            echo "📦 Pulling server image ghcr.io/techysiddhant/10xcoder-server:${IMAGE_TAG}"
            docker pull "ghcr.io/techysiddhant/10xcoder-server:${IMAGE_TAG}"

            echo "🌐 Ensuring shared network exists"
            docker network create app_net 2>/dev/null || true

            echo "🏗️ Recreating infrastructure services (apply Traefik/socket-proxy config changes)"
            docker compose --env-file .env -f docker-compose.infra.yml pull
            docker compose --env-file .env -f docker-compose.infra.yml up -d --force-recreate socket-proxy traefik dozzle
            echo "🔎 Traefik env check"
            docker inspect --format='{{range .Config.Env}}{{println .}}{{end}}' 10xcoder_traefik | grep -E 'DOCKER_API_VERSION|DOCKER_HOST' || true

            echo "📥 Pulling latest application images"
            docker compose --env-file .env pull

            # ── Ensure DB is ready before migrations ──
            echo "🚀 Starting database and redis"
            docker compose --env-file .env up -d db redis

            echo "⏳ Waiting for DB to be ready"
            for i in {1..30}; do
              if docker compose --env-file .env exec -T db sh -lc 'pg_isready -U "$POSTGRES_USER"' >/dev/null 2>&1; then
                echo "✅ DB ready"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "❌ DB failed to become ready"
                exit 1
              fi
              sleep 2
            done

            # ── Run migrations BEFORE starting new server ──
            echo "🧪 Running migrations"
            docker compose --env-file .env --profile migrate run --rm --build migrate

            # ── Capture old container IDs ──
            OLD_IDS=$(docker compose --env-file .env ps -q server 2>/dev/null || true)

            # ── Zero-downtime deployment ──
            echo "🚀 Scaling up new server replica"
            docker compose --env-file .env up -d --no-deps --scale server=2 server

            # Identify new container ID
            ALL_IDS=$(docker compose --env-file .env ps -q server)
            NEW_ID=""
            for cid in $ALL_IDS; do
              if ! echo "$OLD_IDS" | grep -q "$cid"; then
                NEW_ID="$cid"
                break
              fi
            done

            if [ -z "$NEW_ID" ]; then
              echo "❌ Could not identify new container."
              echo "   OLD_IDS: $OLD_IDS"
              echo "   ALL_IDS: $ALL_IDS"
              docker compose --env-file .env ps server
              exit 1
            fi

            echo "⏳ Waiting for new server ($NEW_ID) health check"
            for i in {1..24}; do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$NEW_ID" 2>/dev/null || echo "starting")
              if [ "$STATUS" = "healthy" ]; then
                echo "✅ New server is healthy"
                break
              fi
              if [ "$i" -eq 24 ]; then
                echo "❌ Health check failed — rolling back"
                echo "📋 Failing container logs (last 200 lines)"
                docker logs --tail 200 "$NEW_ID" || true
                echo "🔎 Container health state"
                docker inspect --format='{{json .State.Health}}' "$NEW_ID" || true
                docker stop "$NEW_ID" && docker rm "$NEW_ID" 2>/dev/null || true
                docker compose --env-file .env up -d --scale server=1 server
                exit 1
              fi
              sleep 5
            done

            echo "🔄 Removing old server containers"
            for old_cid in $OLD_IDS; do
              if [ "$old_cid" != "$NEW_ID" ]; then
                echo "   Stopping old container $old_cid"
                docker stop "$old_cid" 2>/dev/null || true
                docker rm -f "$old_cid" 2>/dev/null || true
              fi
            done

            echo "🔄 Scaling to single server (new container preserved)"
            docker compose --env-file .env up -d --no-deps --no-recreate --scale server=1 server

            echo "🗑️ Cleaning old images"
            docker image prune -f || true

            echo "📊 Final container status"
            docker compose --env-file .env ps
            docker compose --env-file .env -f docker-compose.infra.yml ps

            echo "🎉 Deployment completed successfully"
