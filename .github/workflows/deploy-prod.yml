name: Deploy Production

on:
  workflow_run:
    workflows: ["Build and Push to GHCR"]
    types: [completed]
    branches: ["main"]

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: 10xcoder-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      # ----------------------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # Create ENV file
      # ----------------------------------------------------------------------
      - name: Create production env file
        run: |
          echo "${{ secrets.ENV_FILE_PROD }}" > .env

      # ----------------------------------------------------------------------
      # Copy config files to EC2
      # ----------------------------------------------------------------------
      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          source: >
            docker-compose.yml,
            nginx,
            .env,
            scripts,
            apps/api/migration.Dockerfile,
            apps/api/drizzle
          target: /home/${{ secrets.USERNAME }}/10xcoder-prod

      # ----------------------------------------------------------------------
      # Deploy on EC2 (pull and restart)
      # ----------------------------------------------------------------------
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          command_timeout: 5m
          script: |
            set -e

            cd /home/${{ secrets.USERNAME }}/10xcoder-prod

            echo "🔐 Loading environment"
            set -a
            source .env
            set +a

            export COMPOSE_PROJECT_NAME=10xcoder-prod

            echo "🔑 Login to GHCR"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

            echo "📥 Pulling latest images"
            docker compose pull

            echo "🚀 Starting containers"
            docker compose up -d

            echo "⏳ Waiting for DB to be ready"
            for i in {1..30}; do
              if docker compose exec -T db pg_isready -U "$POSTGRES_USER" >/dev/null 2>&1; then
                echo "✅ DB ready"
                break
              fi
              sleep 2
            done

            echo "🧪 Running migrations"
            docker compose --profile migrate run --rm migrate

            echo "🔍 Verifying required migrations in DB"
            MISSING_TAGS=$(docker compose exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT string_agg(tag, ',') FROM (SELECT unnest(ARRAY['0003_uuidv7_resource_domain','0004_fine_description_limit']) AS tag EXCEPT SELECT \"tag\" FROM drizzle.__drizzle_migrations) t;")
            if [ -n "$MISSING_TAGS" ]; then
              echo "❌ Missing required migrations: $MISSING_TAGS"
              exit 1
            fi
            echo "✅ Required migrations are present"

            echo "🗑️ Cleaning old images"
            docker image prune -f || true

            echo "📊 Final container status"
            docker compose ps

            echo "🎉 Deployment completed successfully"
