# Traefik Dynamic Configuration — TLS Certificates
# Cloudflare origin certificates

tls:
  certificates:
    - certFile: /etc/ssl/cloudflare/cert.pem
      keyFile: /etc/ssl/cloudflare/key.pem
  stores:
    default:
      defaultCertificate:
        certFile: /etc/ssl/cloudflare/cert.pem
        keyFile: /etc/ssl/cloudflare/key.pem
