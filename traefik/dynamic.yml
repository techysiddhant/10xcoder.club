# Traefik Dynamic Configuration — TLS Certificates
# Cloudflare origin certificates

http:
  middlewares:
    dashboard-auth:
      basicAuth:
        usersFile: /etc/traefik/users.htpasswd

tls:
  certificates:
    - certFile: /etc/ssl/cloudflare/origin.pem
      keyFile: /etc/ssl/cloudflare/origin-key.pem
  stores:
    default:
      defaultCertificate:
        certFile: /etc/ssl/cloudflare/origin.pem
        keyFile: /etc/ssl/cloudflare/origin-key.pem
